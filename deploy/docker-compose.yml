# Homologação na vm-lab. O CD copia este arquivo para ~/apps/insightflow/backend.
# O .env fica só na VM. Nunca rode `docker compose down -v`: o -v apaga o volume do banco.

services:
  postgres:
    image: postgres:16-alpine
    container_name: insightflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: insightflow-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    image: ghcr.io/insightf-ai/insight-flow-backend:${TAG:-latest}
    command: alembic upgrade head
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    image: ghcr.io/insightf-ai/insight-flow-backend:${TAG:-latest}
    container_name: insightflow-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`hom-api-insight.agilesoftware.net.br`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=le
      - traefik.http.services.backend.loadbalancer.server.port=8000

networks:
  internal:
  proxy:
    external: true
    name: proxy

volumes:
  pgdata:
