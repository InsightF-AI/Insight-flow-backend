# CI: lint + testes em todo push/PR pra main e develop
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# dois jobs em paralelo, um nao depende do outro
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      # so analisa o codigo, nao sobe a api
      - name: Rodar análise estática
        run: ruff check .

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    # postgres real pros testes de integracao dos repositorios (tests/integration)
    # redis real pros testes de integracao do cache (tests/integration/cache)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightflow
          POSTGRES_PASSWORD: insightflow
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://insightflow:insightflow@localhost:5432/insightflow_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # instala as deps do projeto pra conseguir importar o app nos testes
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Rodar testes
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "Nenhum teste encontrado ainda — etapa de teste configurada e pronta."
          fi
