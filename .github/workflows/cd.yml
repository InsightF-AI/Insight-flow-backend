# CD: push na main testa, publica a imagem e implanta só na homologação.
# Produção só muda com uma tag vX.Y.Z ou com o disparo manual, e reaproveita
# a imagem que a homologação já publicou. Esse passo não faz build novo.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_sha:
        description: SHA do commit já implantado na homologação
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-insightflow-backend
  cancel-in-progress: false

jobs:
  ci:
    name: Testes antes do deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightflow
          POSTGRES_PASSWORD: insightflow
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://insightflow:insightflow@localhost:5432/insightflow_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest -q

  homologacao:
    name: Deploy - Homologação
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: homologacao
      url: https://hom-api-insight.agilesoftware.net.br
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: QEMU (build arm64)
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (amd64 e arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copiar compose e subir na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          "${SSH[@]}" "$VM_USER@$VM_HOST" "mkdir -p ~/apps/insightflow/backend/observabilidade"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/docker-compose.yml \
            "$VM_USER@$VM_HOST:apps/insightflow/backend/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/observabilidade/config.alloy \
            "$VM_USER@$VM_HOST:apps/insightflow/backend/observabilidade/config.alloy"
          printf '%s\n' "$GHCR_TOKEN" | "${SSH[@]}" "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u ${ACTOR} --password-stdin"
          "${SSH[@]}" "$VM_USER@$VM_HOST" \
            "set -euo pipefail
             cd ~/apps/insightflow/backend
             export TAG='${IMAGE_TAG}'
             docker compose pull
             docker compose up -d --wait postgres redis
             docker compose run --rm --no-deps migrate
             docker compose up -d --force-recreate --no-deps backend
             if grep -q '^GRAFANA_CLOUD_TOKEN=.' .env; then
               docker compose up -d --force-recreate --no-deps alloy
             else
               echo 'GRAFANA_CLOUD_TOKEN ausente no .env: Alloy nao sobe.'
             fi"

      - name: Smoke test
        run: |
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsS \
            https://hom-api-insight.agilesoftware.net.br/health

  producao:
    name: Deploy - Produção
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api-insight.agilesoftware.net.br
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_sha || github.ref }}

      - name: Commit da imagem ja testada
        id: image
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA invalido"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Confirmar que a imagem ja existe
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools inspect "$IMAGE" >/dev/null

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Copiar compose e subir na Hostinger
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          "${SSH[@]}" "$PROD_USER@$PROD_HOST" "mkdir -p ~/apps/insightflow/backend/observabilidade"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/docker-compose.prod.yml \
            "$PROD_USER@$PROD_HOST:apps/insightflow/backend/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/observabilidade/config.alloy \
            "$PROD_USER@$PROD_HOST:apps/insightflow/backend/observabilidade/config.alloy"
          printf '%s\n' "$GHCR_TOKEN" | "${SSH[@]}" "$PROD_USER@$PROD_HOST" \
            "install -m 700 -d /root/.docker-deploy && export DOCKER_CONFIG=/root/.docker-deploy && docker login ghcr.io -u ${ACTOR} --password-stdin"
          "${SSH[@]}" "$PROD_USER@$PROD_HOST" \
            "set -euo pipefail
             export DOCKER_CONFIG=/root/.docker-deploy
             cd ~/apps/insightflow/backend
             export TAG='${IMAGE_TAG}'
             docker compose pull
             docker compose up -d --wait postgres redis
             docker compose run --rm --no-deps migrate
             docker compose up -d --force-recreate --no-deps backend
             if grep -q '^GRAFANA_CLOUD_TOKEN=.' .env; then
               docker compose up -d --force-recreate --no-deps alloy
             else
               echo 'GRAFANA_CLOUD_TOKEN ausente no .env: Alloy nao sobe.'
             fi"

      - name: Smoke test
        run: |
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsS \
            https://api-insight.agilesoftware.net.br/health
