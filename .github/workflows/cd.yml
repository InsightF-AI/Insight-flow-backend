# CD: push na main publica a imagem e implanta em homologação (vm-lab).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-homologacao
  cancel-in-progress: false

jobs:
  test:
    name: Testes antes do deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightflow
          POSTGRES_PASSWORD: insightflow
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://insightflow:insightflow@localhost:5432/insightflow_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest -q

  deploy:
    name: Deploy - Homologação
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: homologacao
      url: https://hom-api-insight.agilesoftware.net.br
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: QEMU (build arm64)
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (amd64 e arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copiar compose e subir na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          "${SSH[@]}" "$VM_USER@$VM_HOST" "mkdir -p ~/apps/insightflow/backend"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/docker-compose.yml \
            "$VM_USER@$VM_HOST:apps/insightflow/backend/docker-compose.yml"
          printf '%s\n' "$GHCR_TOKEN" | "${SSH[@]}" "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u ${ACTOR} --password-stdin"
          "${SSH[@]}" "$VM_USER@$VM_HOST" \
            "set -euo pipefail
             cd ~/apps/insightflow/backend
             export TAG='${IMAGE_TAG}'
             docker compose pull
             docker compose up -d --wait postgres redis
             docker compose run --rm --no-deps migrate
             docker compose up -d --force-recreate --no-deps backend"

      - name: Smoke test
        run: |
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsS \
            https://hom-api-insight.agilesoftware.net.br/health
