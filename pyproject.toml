[project]
name = "insight-flow-backend"
version = "0.1.0"
description = "Sistema de Análise de Ativos do Mercado Financeiro — backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requer Postgres real rodando (ver docker-compose.yml)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["insightflow-github-setup"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) como valor padrão é o padrão idiomático do FastAPI (não é um bug de mutable default)
extend-immutable-calls = ["fastapi.Depends"]
