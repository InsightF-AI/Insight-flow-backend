[project]
name = "insight-flow-backend"
version = "0.1.0"
description = "Sistema de Análise de Ativos do Mercado Financeiro — backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requer Postgres real rodando (ver docker-compose.yml)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["insightflow-github-setup"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"tests/integration/conftest.py" = ["F401"]
